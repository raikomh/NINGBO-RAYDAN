services:
  - type: web
    runtime: static
    name: businesssearcher-frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false # URL del backend en Render, sin barra final
      - key: VITE_MOCK
        value: "false"
    routes:
      # SPA: todas las rutas sirven index.html (react-router se encarga del resto)
      - type: rewrite
        source: /*
        destination: /index.html
