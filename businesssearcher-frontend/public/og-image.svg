<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- decorative blurred circles, matching the app's hero banner style -->
  <circle cx="1080" cy="60" r="180" fill="#ffffff" opacity="0.08"/>
  <circle cx="1000" cy="560" r="120" fill="#ffffff" opacity="0.07"/>
  <circle cx="80" cy="540" r="140" fill="#ffffff" opacity="0.05"/>

  <!-- logo mark -->
  <g transform="translate(80,90)">
    <rect width="64" height="64" rx="16" fill="#ffffff" opacity="0.16"/>
    <path d="M20 44 L20 26 L32 18 L44 26 L44 44" stroke="#ffffff" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
    <rect x="27" y="32" width="10" height="12" fill="#ffffff"/>
  </g>

  <text x="80" y="230" font-family="Inter, Arial, sans-serif" font-size="64" font-weight="800" fill="#ffffff" letter-spacing="-1">MerkaCuba</text>

  <text x="80" y="300" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="600" fill="#DCE4FF">Encuentra qué tiendas tienen tus productos</text>
  <text x="80" y="345" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="600" fill="#DCE4FF">disponibles, en tiempo real</text>

  <g transform="translate(80,410)">
    <rect width="360" height="56" rx="28" fill="#ffffff" opacity="0.14"/>
    <text x="28" y="36" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="600" fill="#ffffff">Busca • Compara • Compra</text>
  </g>

  <text x="80" y="580" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="500" fill="#C7D2FE">raikomh.github.io/FoodFinder</text>
</svg>
