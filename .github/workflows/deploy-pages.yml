name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'businesssearcher-frontend/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

defaults:
  run:
    working-directory: businesssearcher-frontend

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: businesssearcher-frontend/package-lock.json

      - run: npm ci

      - name: Build
        env:
          # Configurar en Settings -> Secrets and variables -> Actions -> Variables
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_ADMIN_EMAIL: ${{ vars.VITE_ADMIN_EMAIL }}
          # Sin backend configurado, la app funciona en modo demo con datos mock
          VITE_MOCK: ${{ vars.VITE_API_URL == '' && 'true' || 'false' }}
        run: npm run build -- --base=/${{ github.event.repository.name }}/

      # GitHub Pages sirve 404.html en rutas desconocidas; con la copia del
      # index, react-router recibe la URL original y resuelve la ruta (SPA fallback)
      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v4
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: businesssearcher-frontend/dist

      - id: deployment
        uses: actions/deploy-pages@v4
